name: Deploy to VPS

on:
  push:
    branches:
      - main  # или master, если у тебя ветка называется так

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "\${{ secrets.SSH_PRIVATE_KEY_FIX  }}" > ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan -H \${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          # Создаем конфиг, чтобы явно указать путь к ключу и тип
          cat > ~/.ssh/config << EOF
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          # Проверка валидности ключа локально (выведет OK или ошибку)
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Deploy to Server
        run: |
          echo "=== Подключение к серверу ==="
          ssh -v ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            cd /home/deploy/my-app
            
            if [ ! -d ".git" ]; then
              echo "Клонируем репозиторий..."
              git clone git@github.com:S25AI/guestbookApp.git .
            else
              echo "Обновляем существующий репозиторий..."
              git pull origin main
            fi

            echo "Запуск docker compose..."
            docker compose up -d --build --remove-orphans
          EOF