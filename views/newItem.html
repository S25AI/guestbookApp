<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProfilePage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-12">
                
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Создание нового объявления</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Форма отправляется на /items/create, user_id берётся из query-параметра URL -->
                        <form action="/guestbook/items/create?userId={{.}}" method="POST">
                            
                            <!-- Поле: Заголовок -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-bold">Заголовок объявления *</label>
                                <input 
                                    type="text" 
                                    id="title" 
                                    name="title" 
                                    class="form-control" 
                                    placeholder="Например: Велосипед Hartman Hurrican в отличном состоянии"
                                    required
                                    maxlength="255"
                                >
                                <div class="small text-muted">Максимум 255 символов.</div>
                            </div>

                            <!-- Поле: Описание -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Описание</label>
                                <textarea 
                                    id="description" 
                                    name="description" 
                                    class="form-control" 
                                    rows="5" 
                                    placeholder="Расскажите подробно про товар: состояние, характеристики, причина продажи..."
                                ></textarea>
                                <div class="small text-muted">Подробное описание поможет быстрее продать товар.</div>
                            </div>

                            <!-- Поле: Цена -->
                            <div class="mb-4">
                                <label for="price" class="form-label fw-bold">Цена (₽) *</label>
                                <div class="input-group">
                                    <span class="input-group-text">₽</span>
                                    <input 
                                        type="number" 
                                        id="price" 
                                        name="price" 
                                        class="form-control" 
                                        placeholder="0.00"
                                        step="0.01"
                                        min="0"
                                        required
                                    >
                                </div>
                                <div class="small text-muted">Укажите цену в рублях. Дробные значения допускаются.</div>
                            </div>

                            <!-- Кнопка отправки -->
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Опубликовать объявление
                            </button>
                            
                            <div class="mt-3 text-center">
                                <a href="/guestbook/profile/{{.}}" class="text-decoration-none">← Вернуться к профилю</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
