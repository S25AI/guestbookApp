name: Deploy to VPS

on:
  push:
    branches:
      - main  # или master, если у тебя ветка называется так

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "\${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Отключаем проверку хоста (чтобы не спрашивал yes/no при первом подключении)
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            # 1. Заходим в папку проекта
            cd /home/deploy/my-app
            
            # 2. Клонируем проект (или обновляем, если уже есть)
            # Если папка пустая, git clone сработает. Если есть .git - делаем pull.
            if [ ! -d ".git" ]; then
              echo "Клонируем репозиторий..."
              # ⚠️ ЗАМЕНИ ССЫЛКУ НИЖЕ на свою! (SSH ссылка на твой репозиторий)
              git clone git@github.com:S25AI/guestbookApp.git .
            else
              echo "Обновляем существующий репозиторий..."
              git pull origin main
            fi

            # 3. Перезапускаем контейнеры
            # Теперь docker compose увидит твой docker-compose.yml внутри папки
            docker compose up -d --build --remove-orphans
          EOF